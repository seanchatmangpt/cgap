[package]
repository.workspace = true
name = "cgap-integration"
version.workspace = true
edition = "2021"
description = "Cross-crate integration tests: C-ABI roundtrip, alignment law, format-code table, varlen/views roundtrips."
license-file = "../../LICENSE.md"
publish = true # P3-10 guard flip (2026-11-01): registry-only dep surface

# cgap-arrow is consumed ONLY by tests/ (dev-dep below); declaring it in
# [dependencies] too tripped the unused_dependencies manifest warning (W15/W6-b7).
[dev-dependencies]
cgap-arrow = "26.11.1"
# path+version dev-dep: cargo strips the path on publish (dev-deps are
# resolved but never compiled by `cargo publish` verify); kept local because
# cgap-audit is not yet on crates.io (404, witnessed 2026-11-01).
cgap-audit = { path = "../audit", version = "26.11.1" }
cgap-blake3 = "26.11.1"
# std: the scan module (mmap scanner + ScanError surface) is feature-gated.
cgap-parquet = { version = "26.11.1", features = ["std"] }
cgap-git = "26.11.1"
