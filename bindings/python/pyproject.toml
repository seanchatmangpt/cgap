[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cgap"
version = "26.11.5"
description = "ctypes binding for the cgap-ffi Arrow C Data Interface cdylib"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pyarrow>=10"]

[tool.setuptools]
packages = ["cgap", "cgap.tests"]
