[package]
name = "wasm-footprint"
version = "26.11.2"
edition = "2021"
description = "no_std cdylib wrapper supplying the wasm link glue (panic handler + global allocator) around the cgap-arrow / cgap-parquet kernels; the wasm32-wasip1 footprint subject measured by scripts/footprint.sh"
repository = "https://github.com/seanchatmangpt/cgap"
authors = ["Sean Chatman <info@chatmangpt.com>"]
publish = true # P3-10 guard flip (2026-11-01): path deps converted to registry deps
categories = ['no-std', 'wasm']
keywords = ['wasm', 'wasip1', 'footprint', 'no_std', 'cdylib']
license-file = "../../LICENSE.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
cgap-arrow = "26.11.2"
cgap-parquet = "26.11.2"

[dev-dependencies]
cgap-blake3 = "26.11.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# cargo publish's verify step compiles the packaged crate in the DEV profile;
# with the default unwind dev profile the wasm link pulls a memcmp out of
# precompiled core that no wasi libc provides (release's panic="abort" is what
# makes the real footprint build link). Mirror the abort setting so the
# publish verification compiles the artifact the way the footprint gate does.
[profile.dev]
panic = "abort"
opt-level = 3

# Standalone manifest, deliberately NOT a member of the root workspace (the
# coordinator owns crates root Cargo.toml). The empty [workspace] table makes
# this crate its own workspace root, so a build from inside this directory is
# self-contained: crate-local Cargo.lock and crate-local target/ dir.
[workspace]

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
