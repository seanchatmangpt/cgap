[package]
publish = true
categories = ['api-bindings', 'os:macos']
keywords = ['metal', 'gpu', 'zero-copy', 'unified-memory']
name = "cgap-gpu"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
description = "GPU execution membrane for the cgap sovereign substrate: Metal Unified Memory zero-copy buffer bridging."
license-file = "../../LICENSE.md"
repository.workspace = true
authors.workspace = true

[dependencies]
cgap-arrow = { path = "../cgap-arrow", version = "26.11.2" }

[build-dependencies]
cc = "1.0"

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
