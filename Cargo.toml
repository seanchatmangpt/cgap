[workspace]
# License: governed by LICENSE-P28-SIL.md (P28-SIL v2.1.0,
# urn:avec:license:p28-sil:v2.1.0-sovereign); see LICENSE.md. No SPDX
# expression — the instrument is identified by URN (§9).

resolver = "2"
members = [
    "crates/cgap",
    "crates/cgap-arrow",
    "crates/cgap-blake3",
    "crates/cgap-parquet",
    "crates/cgap-ffi",
    "crates/cgap-beam",
    "crates/cgap-gpu",
    "crates/cgap-git",
    "crates/bench",
    "crates/audit",
    "crates/integration",
    # NOTE: crates/cli is a standalone ggen six-pack generated crate (its own
    # [workspace]); it is deliberately NOT a member here.
    # v26.11.1 moonshot lanes (A01-A20) - coordinator-scaffolded so lanes
    # never edit this root manifest (same-checkout fan-out, disjoint
    # ownership). PROPOSED until lane courts land.
    "crates/cgap-core",
    "crates/cgap-storage",
    "crates/cgap-bont",
    "crates/cgap-bosym",
    "crates/cgap-bn3",
    "crates/cgap-gate",
    "crates/cgap-crypto",
    "crates/cgap-p28",
    # v26.11.2 starDF MW4: semi-naive Datalog closure kernel (lane W3-R4).
    "crates/cgap-court",
    # v26.11.2 W6 lane B1: centralized branchless ALU/SWAR mechanics.
    "crates/cgap-branchless",
    "ontologies/fibo",
    "ontologies/cloud",
]


[workspace.dependencies]
# v26.11.2 W6 lane W1: centralized branchless ALU/SWAR mechanics.
cgap-branchless = { path = "crates/cgap-branchless", version = "26.11.2", default-features = false }

[workspace.package]
license-file = "LICENSE.md"
version = "26.11.2"
edition = "2021"
repository = "https://github.com/seanchatmangpt/cgap"
authors = ["Sean Chatman <info@chatmangpt.com>"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

[profile.audit]
inherits = "release"
lto = false
codegen-units = 16
strip = false
panic = "abort"
