[package]
repository.workspace = true
authors.workspace = true
name = "cgap-ffi"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
description = "C Data Interface cdylib membrane for cgap (Gate 3 wire-parity exports)."
license-file = "../../LICENSE.md"
publish = true # P3-2b guard flip (2026-11-01): was `publish = false`; A19 receipt substantially-witnessed PARTIAL/ALIVE (docs/jira/v26.11.1/waves/a19-finish-receipt.md)
categories = ['api-bindings', 'development-tools::ffi']
keywords = ['c-data-interface', 'cabi', 'wire-parity', 'ffi']

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cgap-arrow = { path = "../cgap-arrow", version = "26.11.3" }

# Wave F2 item 5 (SEAM-CRYPTO-FFI) — DISCLOSED CROSS-TOUCH (lane lease was
# src/sovereign.rs; manifest is coordinator-owned, disclosed both directions
# per the A17-Wave-2/A18-Wave-3 minimal-unblock precedent in cgap-p28's own
# manifest): the A19 §2 owner-table body for `cgap_verify_p28` lands against
# cgap-p28's real attestation verify path. HOST-SURFACE ONLY: cgap-p28 is
# std-gated today (attestation.rs:130 `impl std::error::Error`), so the XIP
# (`target_os = "none"`) build keeps the pre-existing dep set — the T1
# rv32imc staticlib size court and the rv32imc check gate are unaffected.
[target.'cfg(not(target_os = "none"))'.dependencies]
cgap-p28 = { path = "../cgap-p28", version = "26.11.3" }
# GAP-1 (2026-11-01) — DISCLOSED UNAVOIDABLE CROSS-TOUCH (lane lease was
# src/sovereign.rs + include/cgap.h; manifest is coordinator-owned, disclosed
# here and in the lane receipt per the Wave-F2 cgap-p28 precedent above):
# the three remaining sovereign bodies (§2 owner table) delegate to the real
# owner-lane paths — admit: A04 frame validation + A14 penstock ingress
# (cgap-core/cgap-gate), eval: A12 unifier + A13 builtins vocabulary
# (cgap-bn3), commit: A02 sealed-block writer (cgap-parquet). BLAKE3 is the
# A04 admit-path digest substrate (crates/cgap-core/tests/common/mod.rs canon:
# `use cgap_blake3::hash as oabi_digest`). All five stay HOST-surface: the
# `target_os = "none"` XIP build keeps the pre-existing dep set, so the T1
# rv32imc ELF size court and the rv32imc check gate are unaffected.
cgap-core = { path = "../cgap-core", version = "26.11.3" }
cgap-gate = { path = "../cgap-gate", version = "26.11.3" }
cgap-bn3 = { path = "../cgap-bn3", version = "26.11.3" }
cgap-blake3 = { path = "../cgap-blake3", version = "26.11.3" }
cgap-parquet = { path = "../cgap-parquet", version = "26.11.3", features = ["std"] }

[dev-dependencies]
# Same crate as the normal dependency; needed only by tests/ to reach the
# c_abi release callbacks and ForeignArray for lifecycle assertions.
cgap-arrow = { path = "../cgap-arrow", version = "26.11.3" }
# Hot-path allocation courts (tests/alloc_courts.rs): linking cgap_audit into
# the test binary installs its CountingAlloc #[global_allocator] and exposes
# with_alloc_tracking for the zero-alloc assertions.
cgap-audit = { path = "../audit", version = "26.11.3" }
# The stardf consumer court now lives with its subject: stardf WIP upstream
# (2026-10-31), and cgap must not carry any stardf dependency — cargo resolves
# every workspace member's dev-deps during `cargo publish`, so a stardf
# dev-dep here blocked packaging all four published crates. Moved to
# ggen-legacy/stardf/arrow crates/stardf-arrow-capi/tests/cgap_consumer_court.rs
# (path-dev-deps on cgap-ffi/cgap-audit from the stardf side).

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
