[package]
name = "cgap-parquet"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
description = "Parquet persistence kernels with branch-free inner-loop bodies: bit-unpacking, SWAR RLE, page-to-buffer decode (no_std, zero dependencies)."
repository.workspace = true
authors.workspace = true
publish = true
categories = ['no-std', 'encoding', 'parser-implementations']
keywords = ['parquet', 'columnar', 'swar', 'bit-unpack', 'no_std']
license-file = "../../LICENSE.md"

[features]
default = []
std = []

[dependencies]

[dev-dependencies]
# tests/codec_properties.rs (wave-14 lane 10): Quad64 wire round-trip property
# reaches the real cgap-arrow layout — same crate-as-dev-dep pattern as
# cgap-ffi. Workspace path dep; adds no external dependency.
cgap-arrow = { path = "../cgap-arrow" }
# ZP-18 timing fence: tests/accessor_perf_court.rs + tests/aligned_interop.rs
# compose cgap_aoq::profile_guard (assert_release loud-skip + black_box fence).
# Dev-dep only: the published kernel [dependencies] stays empty/no_std.
cgap-aoq = { path = "../cgap-aoq" }

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
