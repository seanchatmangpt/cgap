[package]
repository.workspace = true
name = "cgap-core"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
description = "128-byte sovereign CgapFrameHeader codec and triumvirate isomorphism kernels for the cgap substrate."
publish = true # P3-2b guard flip (2026-11-01): was `publish = false`; A04 receipt ALIVE (docs/jira/v26.11.1/waves/a04-finish-receipt.md)
categories = ["no-std", "data-structures"]
keywords = ["frame-header", "codec", "isomorphism", "no_std"]
license-file = "../../LICENSE.md" # DOD-01 F3a / DOD-05 FLAG flip: branchless pattern (cgap-branchless/Cargo.toml:5); no SPDX keys per lane-A04 DoD 10
# P28-SIL v2.1.0 sovereign licensing instrument (no SPDX-shaped keys per
# lane-A04 DoD 10 / tests/manifest_court.rs — the URN is the only lawful
# instrument pointer; FIX-01's key reverted, see
# docs/jira/v26.11.3/lanes/lane-dod-01-spdx.md):
#   urn:avec:license:p28-sil:v2.1.0-sovereign
# (canonical spec identifier per LICENSE-P28-SIL.md; URN frozen per
# docs/jira/v26.11.1/03-rename-receipt.md decision D2; cited per lane-A04
# DoD 10. No SPDX identifiers.)

[lib]

# §3 zero-dependency rule, named exception: "#[cfg(test)]-gated use of the
# repo's existing in-tree adapters for cross-tier courts". cgap-blake3 is the
# lane-doc-named digest substrate (A04 §10, A17 §3); it supplies the real
# BLAKE3 to `oabi_digest`/`verify_payload` at court call sites only. The
# runtime library keeps E=0 externals (dev-dependencies never compile into
# the lib target).
[dev-dependencies]
cgap-blake3 = { path = "../cgap-blake3", version = "26.11.3" }
# Wave 9 cross-lane integration: the A14 dam (cgap-gate penstock `ingress`)
# consumes real A04 frames in tests/cross_lane_gate_court.rs. Same §3 named
# exception as cgap-blake3 — dev-only, never compiled into the lib target;
# the runtime library stays E=0 externals.
cgap-gate = { path = "../cgap-gate", version = "26.11.3" }


[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
