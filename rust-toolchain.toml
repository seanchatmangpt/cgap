# Toolchain pin for the cgap workspace (G09 gate repair, 2026-10-31).
#
# WHY: the workspace floor is rust-version = 1.98; an ambient rustup
# default below the floor refuses the manifests, turning consumer-court
# gates RED (exit 101 witness, 2026-10-31 21:02-21:05).
#
# CHANNEL: floating nightly, the same posture the kernel crates pin —
# courts must build the workspace exactly as CI builds it. No
# `#![feature(...)]` is used by any gate; gates run as plain `cargo
# test` with NO RUSTFLAGS override.
[toolchain]
channel = "nightly"
