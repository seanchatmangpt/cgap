[package]
name = "cgap-git"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
description = "Git Packfile v2 writer: stored blob objects, .idx v2 generation, in-crate SHA-1 and CRC32 (zero external dependencies)."
repository.workspace = true
authors.workspace = true
publish = true
categories = ['development-tools', 'encoding']
keywords = ['git', 'packfile', 'sha1', 'crc32', 'no_std']
license-file = "../../LICENSE.md"

[lints.rust]
# R-ADV11FIX introduced cfg(implcell_critical_provided) in ref_store.rs
# (opt-in via RUSTFLAGS="--cfg implcell_critical_provided"); rustc 1.101.0-nightly
# flags it as unexpected_cfgs. Allowlist per rustc's own printed suggestion.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(implcell_critical_provided)'] }

[features]
# `std` is a HOST-ONLY convenience feature (red-11 finding 5): OS-less
# targets (riscv32imc-unknown-none-elf, target_os = "none") have no std
# in their toolchain core (raw E0463, exit 101 with default features).
# The no_std kernel build is `--no-default-features`; selecting `std` on
# an OS-less target now fails LOUDLY with a compile_error pointing at
# the fix (RC-02 witness, crates/cgap-git/src/ref_store.rs, file tail).
default = ["std"]
std = []

[dependencies]

[dev-dependencies]
# tests/lineage_workflow.rs (v26.11.2 lane p1-lineage): cross-kernel
# workflow court over the real cgap-parquet sealer and the real
# cgap-blake3 register. Workspace path deps; dev-only, adds no external
# dependency to the published kernel ([dependencies] stays empty).
cgap-blake3 = { path = "../cgap-blake3" }
cgap-parquet = { path = "../cgap-parquet" }

cgap-bn3 = { path = "../cgap-bn3" }

# ZP-18 timing fence: tests/ingress_ring_court.rs, tests/ladder_timing_stress.rs,
# tests/perf_baseline.rs and tests/retract_court.rs compose
# cgap_aoq::profile_guard (assert_release loud-skip + black_box fence).
# Dev-dep only: the published kernel [dependencies] stays empty/no_std.
cgap-aoq = { path = "../cgap-aoq" }

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
