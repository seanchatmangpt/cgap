[package]
repository.workspace = true
license-file.workspace = true
default-run = "bench"
name = "bench"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
description = "Divan membrane: v26.11.1 Phase 2 (Measure) perf-target graduation harness."
publish = false

[dependencies]
cgap-arrow = { path = "../cgap-arrow" }
cgap-blake3 = { path = "../cgap-blake3" }
cgap-parquet = { path = "../cgap-parquet", features = ["std"] }
# ZP-18 Phase C: release-profile loud-SKIP guard for bench binaries.
cgap-aoq = { path = "../cgap-aoq" }

# R6-16: cgap-ffi/cgap-git/cgap-storage are used ONLY by [[bench]] targets
# (mctq_consolidation, seal, chains-sovereign, challenger_git, dred_churn,
# closure, mat_closure — no src/bin usage), and cargo's `unused_dependencies`
# lint does not scan bench/test targets. Moved here from [dependencies] so
# the 3 manifest warnings (FS-17 census) resolve without deleting real use.
# cgap-core/gate/bn3/p28 moved likewise: bench-only usage, and once
# cgap-ffi left [dependencies] they left the normal-dep closure (the lint
# counts transitive appearance as use) and began warning themselves.
[dev-dependencies]
cgap-core = { path = "../cgap-core" }
cgap-gate = { path = "../cgap-gate" }
cgap-bn3 = { path = "../cgap-bn3" }
cgap-p28 = { path = "../cgap-p28" }
cgap-crypto = { path = "../cgap-crypto" }
cgap-ffi = { path = "../cgap-ffi" }
cgap-git = { path = "../cgap-git" }
cgap-storage = { path = "../cgap-storage" }
cgap-branchless = { path = "../cgap-branchless" }
# Exact-at-authoring-time pin. `cargo search divan` 2026-11-01 -> 0.1.21
# (exit 0, witnessed this session). A caret pin drifts silently across 0.1.x;
# exact only.
divan = "=0.1.21"

# Prior-campaign surface (retained; nothing deleted).
[[bench]]
name = "v26_10_31"
harness = false

# v26.11.1 Phase 2 (Measure) membrane targets. `kernels` is the F2-10
# scaffold stub; `ingress`/`parquet`/`bn3`/`seal` file bodies are owned by
# lanes F2-11..F2-14 (declared here so the surface is fixed once).
[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "ingress"
harness = false

[[bench]]
name = "parquet"
harness = false

[[bench]]
name = "bn3"
harness = false

[[bench]]
name = "bn3_inversion_thesis_court"
harness = false

[[bench]]
name = "seal"
harness = false

# Challenger sales report benchmark targets
[[bench]]
name = "challenger_parquet"
harness = false

[[bench]]
name = "challenger_arrow"
harness = false

[[bench]]
name = "challenger_git"
harness = false

[[bench]]
name = "challenger_crypto"
harness = false

[[bench]]
name = "csct_sovereign"
harness = false

# BENCH-* chains: staged end-to-end chains, each over one seeded corpus.
# Declared ONCE by BENCH-1 (all five targets in this single edit) so the
# bench surface is fixed and polling lanes see a stable manifest; the file
# bodies are lane-owned (chains-ingress.rs = BENCH-1; chains-parquet/bn3/
# seal/sovereign.rs = their own lanes). Cargo refuses a manifest whose
# declared target file is absent, so the four sibling bodies must land for
# non-ingress chains runs — disclosed, not silent.
[[bench]]
name = "chains-ingress"
harness = false

[[bench]]
name = "chains-parquet"
harness = false

[[bench]]
name = "chains-bn3"
harness = false

[[bench]]
name = "chains-seal"
harness = false

[[bench]]
name = "chains-sovereign"
harness = false

# W3-R4 / starDF MW4: G3-MAT transitive-closure bench (semi-naive kernel,
# landed by lane V1 as mat_closure; see w5-g3-mat-closure.md receipt).
[[bench]]
name = "mat_closure"
harness = false

# W4-K1 / G4-DRED: 90% churn + entropy-sweep retraction bench over the
# splitmix64-seeded fact corpus, with an oracle set-equality court and a
# ratio fence against the full-recompute oracle arm (no absolute-ms-only
# claims). Sandbox courts mutate /tmp copies of dred.rs / dred_churn.rs.
[[bench]]
name = "dred_churn"
harness = false

# p1-closure pairs/s bench (harness=false Instant method, see file doc).
[[bench]]
name = "closure"
harness = false

# p1-bgp: multi-hop BGP equi-join bench (Divan; joins/s via ItemsCount
# over full-chain matches; court = cgap-bn3/tests/bgp_hop_courts.rs).
[[bench]]
name = "bgp"
harness = false

# Lane XC-04: M-CTQ-04/05/06 consolidation bench (harness=false Instant
# method, csct N=7 Min/Median/Max; see mctq_consolidation.rs header).
[[bench]]
name = "mctq_consolidation"
harness = false

[[bench]]
name = "stream_compact_simd"
harness = false

[[bench]]
name = "ring_cache_coherency"
harness = false

[[bench]]
name = "memory_bounds"
harness = false

[[bench]]
name = "parquet_cold_streaming"
harness = false

# R-CGAP1 (arcus E10 parity): conservation-asserting Little's Law court.
# Must be harness=false or auto-discovery builds it as a libtest harness,
# divan::main never runs, and the conservation asserts never execute.
[[bench]]
name = "adversarial_littles_law_court"
harness = false

# Cross-subsystem continuous pipeline consumer (arcus -> cgap -> smalt).
[[bin]]
name = "cgap_e2e_consumer"
path = "src/bin/cgap_e2e_consumer.rs"
