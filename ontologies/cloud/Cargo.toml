[package]
repository.workspace = true
name = "cgap-cloud"
version.workspace = true
edition.workspace = true
description = "Cloud ontology O-ABI pack for the cgap sovereign columnar substrate: build-time-emitted binary ontology pack, no_std const/types facade."
license-file = "../../LICENSE.md"
# P3-8 publish flip (2026-11-01): was `publish = false`; O-ABI packs are the
# publish payload.
publish = true
exclude = ["RECEIPT.md"] # DOD-05 Finding 2 coordinator call: internal receipt doc (24,963 B) out of the published tarball; mechanical + reversible

# Lane A10 (docs/jira/v26.11.1/lanes/A10-cloud-oabi.md), build/runtime split
# mirroring A09: the `#![no_std]` facade (src/lib.rs) itself uses NO
# dependencies — const/types only (lexeme table, slot goldens, equivalence
# table, metadata). `cgap-blake3` + `cgap-bont` are linked for the BUILD-TIME
# `emit-pack` bin and the courts: the emitter collision-vets through A06's
# real `CollisionDetector`, emits A06's real container types, and validates
# its own output through A06's real loader before writing (Chicago: real
# collaborators end to end).
[dependencies]
cgap-blake3 = { path = "../../crates/cgap-blake3", version = "26.11.2" }
cgap-bont = { path = "../../crates/cgap-bont", version = "26.11.2" }
