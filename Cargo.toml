resolver = "2"
members = [
    "crates/cgap",
    "crates/cgap-arrow",
    "crates/cgap-blake3",
    "crates/cgap-parquet",
    "crates/cgap-ffi",
    "crates/cgap-beam",
    "crates/cgap-gpu",
    "crates/cgap-git",
    "crates/bench",
    "crates/audit",
    "crates/integration",
    # NOTE: crates/cli is a standalone ggen six-pack generated crate (its own
    # [workspace]); it is deliberately NOT a member here.
    # v26.11.1 moonshot lanes (A01-A20) - coordinator-scaffolded so lanes
    # never edit this root manifest (same-checkout fan-out, disjoint
    # ownership). PROPOSED until lane courts land.
    "crates/cgap-core",
    "crates/cgap-storage",
    "crates/cgap-bont",
    "crates/cgap-bosym",
    "crates/cgap-bn3",
    "crates/cgap-gate",
    "crates/cgap-crypto",
    "crates/cgap-p28",
    # v26.11.3 starDF MW4: semi-naive Datalog closure kernel (lane W3-R4).
    "crates/cgap-court",
    # v26.11.3 W6 lane B1: centralized branchless ALU/SWAR mechanics.
    "crates/cgap-branchless",
    # v26.11.3 AoQ Wave-1 lane AB-1: AOQ1 wire-law header kernel.
    "crates/cgap-aoq",
    # v26.11.3 P5 phases 1-2: CBMQS std host tool (certificate emit/verify).
    "crates/cbmqs-cli",
    "ontology-packs/fibo",
    "ontology-packs/cloud",
]


[workspace.dependencies]
# v26.11.3 W6 lane W1: centralized branchless ALU/SWAR mechanics.
cgap-branchless = { path = "crates/cgap-branchless", version = "26.11.5", default-features = false }

[workspace.package]
license-file = "LICENSE.md"
version = "26.11.5"
edition = "2021"
# MSRV-02 (DOD-01 F2): workspace-scope MSRV. Matches crates/cli's declared
# 1.85 (edition-2021-era stable features). Members opt in via
# `rust-version.workspace = true`; not yet wired (file ownership).
rust-version = "1.85"
repository = "https://github.com/seanchatmangpt/cgap"
authors = ["Sean Chatman <info@chatmangpt.com>"]

# PANIC=ABORT RATIONALE (PL7, do not flip to unwind): the AoQ kernel
# sidecar (crates/cgap-ffi/src/bin/aoq_sidecar.rs) has exactly three named
# exits, and abort is load-bearing for one of them. A panic escaping the
# serve loop becomes SIGABRT, the arcus supervisor reaps the abnormal death
# and respawns a fresh generation — the process-boundary twin of the
# in-process catch_unwind -> BUSY surface in
# crates/cgap-ffi/src/aoq_session.rs:202-401. With unwind, a poisoned serve
# loop would keep serving; with abort, every poison lands on the supervisor
# boundary where the respawn/derive law already governs. Twin profile
# blocks (dev/audit) carry the same law.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

[profile.audit]
inherits = "release"
lto = false
codegen-units = 16
strip = false
panic = "abort"
