[package]
name = "cgap-blake3"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
description = "Sovereign, zero-dependency #![no_std] BLAKE3 cryptographic tree hash with 4-way NEON parent Merkle reduction (8-way AVX2 path feature-gated; 26.11.3 re-witness owed)."
repository.workspace = true
authors.workspace = true
publish = true
categories = ['no-std', 'cryptography']
keywords = ['blake3', 'hash', 'merkle', 'avx2', 'neon']
license-file = "../../LICENSE.md"

[features]
default = []
std = []

[dependencies]

# ZP-18: timing fences for benches/tests (dev-only edge; the lib surface
# stays zero-dep no_std).
[dev-dependencies]
cgap-aoq = { path = "../cgap-aoq" }

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
