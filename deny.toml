# cargo-deny config for cgap (XC-5r rec #2).
# Shape mirrors /Users/sac/ggen/deny.toml (template default), trimmed to the
# two sections wired into CI: advisories + licenses.
#
# cgap's kernel crates are zero-external-dependency (E=0), so the advisory
# check comes back clean. XD-1 history: the licenses check used to FAIL by
# design (license-file = LICENSE.md, no SPDX key, unexpressible in the SPDX
# allowlist) and ran NON-BLOCKING in CI per
# docs/jira/v26.11.3/receipts/xd-1-deny-toml.md.
#
# XD-1 close condition (2026-11-04): the licenses check is taught the
# P28-SIL license-file via `[[licenses.clarify]]` — one entry per
# workspace crate, each bound to the custom identifier
# `LicenseRef-P28-SIL` (the SPDX-compliant form for a non-SPDX license).
# The crates' licensing INTENT is unchanged: they still declare
# `license-file = LICENSE.md`; clarify only teaches the scanner how to
# read it. The clarify license-files hash 0x8273ca50 pins the LICENSE.md
# text — a license-text change re-breaks the check loudly. See
# docs/jira/v26.11.3/receipts/yd-1-licenses-clarify.md.
#
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# The path where the advisory databases are cloned/fetched into
#db-path = "$CARGO_HOME/advisory-dbs"
# The url(s) of the advisory databases to use
#db-urls = ["https://github.com/rustsec/advisory-db"]
# A list of advisory IDs to ignore. Ignored advisories still emit a note.
ignore = [
    #"RUSTSEC-0000-0000",
]
# If true, use the git executable to fetch the advisory database instead of
# the built-in git library (helpful for special auth requirements).
#git-fetch-with-cli = true

[licenses]
# Explicitly allowed licenses (SPDX short identifiers).
# https://spdx.org/licenses/
allow = [
    "MIT",
    "Apache-2.0",
    # P28-SIL sovereign license, custom identifier (LicenseRef- prefix is
    # the SPDX-compliant way to express a non-SPDX license); reached via
    # the [[licenses.clarify]] entries below.
    "LicenseRef-P28-SIL",
]
# Confidence threshold for detecting a license from its text.
confidence-threshold = 0.8
# Per-crate license exceptions.
exceptions = [
    #{ allow = ["Zlib"], crate = "adler32" },
]

# Some crates don't have easily machine-readable licensing information;
# add a clarification entry to specify it manually.
#[[licenses.clarify]]
#crate = "ring"
#expression = "MIT AND ISC AND OpenSSL"
#license-files = [
    #{ path = "LICENSE", hash = 0xbd0eed23 }
#]

# One clarify entry per license-file workspace crate (21 total). Each binds
# the crate's `license-file = LICENSE.md` (P28-SIL) to LicenseRef-P28-SIL.
# `license-files.path` is crate-root-relative and `hash` pins the exact
# LICENSE.md text cargo-deny computed (0x8273ca50, uniform across all 21
# crates) — a license-text edit re-breaks the check loudly rather than
# passing silently.
[[licenses.clarify]]
crate = "cgap"
expression = "LicenseRef-P28-SIL"
license-files = [{ path = "../../LICENSE.md", hash = 0x8273ca50 }]

