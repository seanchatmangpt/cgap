[package]
repository.workspace = true
authors.workspace = true
name = "cgap-storage"
version.workspace = true
edition.workspace = true
description = "WAL-framed transactional storage engine (flash model, Txn commit path, differential erase sweeps) for the cgap substrate."
license-file = "../../LICENSE.md"
publish = true # P3-2b guard flip (2026-11-01): was `publish = false`; A05 receipt ALIVE (docs/jira/v26.11.1/waves/a05-finish-receipt.md)
categories = ['no-std', 'database-implementations']
keywords = ['wal', 'transaction', 'flash', 'embedded', 'no_std']

[dependencies]
# A05 §3.3: BLAKE3 binds payload identity (96-bit prefix split header/trailer).
# Workspace-internal, zero-dependency, no_std — E=0 runtime externals preserved.
cgap-blake3 = { path = "../cgap-blake3", version = "26.11.2" }

[dev-dependencies]
# Wave-5 defect repair: the "same identity as cgap-git" claim for the
# journal's IEEE CRC-32 was UNVERIFIED (no court pinned it). This
# workspace-internal, zero-external-dependency dev-dep backs
# tests/court_crc_identity.rs — a real-collaborator differential court.
# Runtime externals stay E=0 (dev-deps are test-only).
cgap-git = { path = "../cgap-git", version = "26.11.2" }

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
