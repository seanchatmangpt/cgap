[package]
repository.workspace = true
authors.workspace = true
name = "cgap-crypto"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
publish = true
categories = ['no-std', 'cryptography']
keywords = ['blake3', 'keyed', 'seal', 'merkle', 'no_std']
description = "Sovereign, zero-dependency #![no_std] keyed BLAKE3 cryptography kernel (keyed digest engine, sealed transcripts, Merkle helpers) on the cgap-blake3 substrate."
license-file = "../../LICENSE.md"
# P28-SIL v2.1.0 sovereign license instrument:
#   urn:avec:license:p28-sil:v2.1.0-sovereign
# (cited like cgap-core per lane-A16 receipt; no SPDX identifiers.)

[lib]

[dependencies]
# One BLAKE3 kernel, many bindings (no O(N^2) drift): the keyed digest
# engine in `src/chatman.rs` binds cgap-blake3's public `compress_scalar`
# + chunk/parent/root flags. cgap-blake3 itself exposes NO keyed API (its
# external-vector test says so loudly); the keyed mode lives here.
cgap-blake3 = { path = "../cgap-blake3", version = "26.11.3" }

[features]
# decaps-only: soft gate (keygen/encaps dead_code-allowed) for the
# rekey-verifier compile surface.
decaps-only = []

[dev-dependencies]
# Courts compute Merkle leaves/parents and cross-check digests against the
# real unkeyed kernel (Chicago: real collaborators, no mocks).
cgap-blake3 = { path = "../cgap-blake3", version = "26.11.3" }
# AB-4 (PG-A3): RFC 8439 cross-check court — the REAL RustCrypto
# chacha20poly1305 validates the local donna kernel byte-for-byte, both
# directions. DEV-ONLY: the lib dependency surface stays zero-dep.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
