[package]
repository.workspace = true
authors.workspace = true
name = "cgap-gate"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
description = "Campaign boundary gate kernels: fail-closed guard evaluation courts for the cgap substrate."
license-file = "../../LICENSE.md"
publish = true # P3-2b guard flip (2026-11-01): was `publish = false`; A14 receipt ALIVE (docs/jira/v26.11.1/waves/a14-finish-receipt.md)
categories = ['no-std', 'development-tools']
keywords = ['guard', 'fail-closed', 'court', 'no_std']

[lib]

# W6 lane B7: consume the centralized branchless ALU/SWAR mechanics crate.
# Body-site swaps deferred: none of the current penstock sites match a
# shipped branchless primitive exactly (see waves/w6-b7-gate-consume.md).
[dependencies]
cgap-branchless = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]

# CG-1 (v26.11.3, G6): dev-only — the Wave-1 frozen mirror structs in
# penstock.rs are checked BYTE-FOR-BYTE against the canonical cgap-core
# types (tests/frame_abi_mirror_court.rs). Never a runtime dep: the gate
# kernel stays zero-dep on the publish surface.
[dev-dependencies]
cgap-core = { path = "../cgap-core" }
