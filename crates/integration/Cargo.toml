[package]
repository.workspace = true
name = "cgap-integration"
rust-version.workspace = true
version.workspace = true
edition = "2021"
description = "Cross-crate integration tests: C-ABI roundtrip, alignment law, format-code table, varlen/views roundtrips."
license-file = "../../LICENSE.md"
publish = true # P3-10 guard flip (2026-11-01): registry-only dep surface
categories = ['development-tools']
keywords = ['integration', 'roundtrip', 'cabi', 'wire-parity']

# cgap-arrow is consumed ONLY by tests/ (dev-dep below); declaring it in
# [dependencies] too tripped the unused_dependencies manifest warning (W15/W6-b7).
[dev-dependencies]
# ZP-18 timing-fence census (ffi-ZP18-D): cgap-aoq pulled in as a DEV-DEPENDENCY
# ONLY (tests/profile_guard fence compose); never a runtime dep edge.
# path+version dev-dep (cargo strips path on publish), same pattern as cgap-audit
# below — cgap-aoq is not yet on crates.io (zd-119: name-free).
cgap-aoq = { path = "../cgap-aoq", version = "26.11.3" }
cgap-arrow = "26.11.2" # CALVER-BUMP-26.11.3: minimum-bound pin; ^26.11.2 already admits 26.11.3; registry-only dev-dep (no path), ^26.11.3 breaks offline root resolve until 26.11.3 publish lift
# path+version dev-dep: cargo strips the path on publish (dev-deps are
# resolved but never compiled by `cargo publish` verify); kept local because
# cgap-audit is not yet on crates.io (404, witnessed 2026-11-01).
cgap-audit = { path = "../audit", version = "26.11.3" }
cgap-blake3 = "26.11.2" # CALVER-BUMP-26.11.3: minimum-bound pin, see cgap-arrow note
# std: the scan module (mmap scanner + ScanError surface) is feature-gated.
cgap-parquet = { version = "26.11.2", features = ["std"] } # CALVER-BUMP-26.11.3: minimum-bound pin, see cgap-arrow note
cgap-git = "26.11.2" # CALVER-BUMP-26.11.3: minimum-bound pin, see cgap-arrow note

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
